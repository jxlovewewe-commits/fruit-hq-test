<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><title>과일 본부 관리</title>
<style>
:root{--o:#f08a24;--od:#d9730d;--ol:#fff4e8;--bg:#f4f5f7;--tx:#1f2328;--mu:#6b7280;--ln:#eceef1;--in:#dfe3e8}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.top{background:#fff;border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5}
.top .in{max-width:560px;margin:auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-size:19px;font-weight:800;letter-spacing:-.3px}.logo em{font-style:normal;color:var(--o)}
.top .sub{font-size:12px;color:var(--mu);text-align:right}
.wrap{max-width:560px;margin:auto;padding:14px 14px 100px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.06)}
.ct{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 12px;font-size:16px;font-weight:700}
.ct small{font-size:12px;color:var(--mu);font-weight:500}
.ct a{font-size:13px;color:var(--od);text-decoration:none;font-weight:600}
.pg{font-size:20px;font-weight:800;margin:4px 2px 12px;letter-spacing:-.3px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:#fff;border-radius:16px;padding:14px;box-shadow:0 1px 2px rgba(16,24,40,.06)}
.kpi .l{font-size:12px;color:var(--mu);font-weight:600}.kpi .v{font-size:22px;font-weight:800;margin-top:4px;letter-spacing:-.4px}
.kpi .v small{font-size:13px;font-weight:600;margin-left:1px}
.kpi.hl{background:linear-gradient(135deg,#ffb04a,#f08a24);color:#fff}.kpi.hl .l{color:#fff;opacity:.9}
.kpi.warn .v{color:#c62828}
.kpis.k3{grid-template-columns:1fr 1fr 1fr;gap:8px}.k3 .kpi{padding:12px 10px}.k3 .kpi .v{font-size:16px;white-space:nowrap;letter-spacing:-.5px}.k3 .kpi .v small{font-size:12px}
.b{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.b-접수{background:#eef0f3;color:#4b5563}.b-승인{background:#e7efff;color:#1d4ed8}.b-출고완료{background:#e4f5ea;color:#15803d}.b-취소{background:#fdecec;color:#c62828}
.b-미정산{background:var(--ol);color:#c2570c}.b-정산완료{background:#e4f5ea;color:#15803d}
.ex{font-size:11px;font-weight:600;color:#9a6a2f;background:#fbf1e3;border-radius:6px;padding:2px 7px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:46px;padding:10px 16px;border-radius:12px;font:inherit;font-size:15px;font-weight:700;border:1px solid var(--in);background:#fff;color:var(--tx);cursor:pointer;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--o);border-color:var(--o);color:#fff}.btn.pri:disabled{background:#f6c08c;border-color:#f6c08c}
.btn.soft{background:var(--ol);border-color:var(--ol);color:var(--od)}
.btn.danger{color:#c62828;border-color:#f3cccc}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.blk{width:100%}
.acts{display:flex;gap:8px;margin-top:12px}.acts .btn{flex:1}
.btns{display:flex;flex-wrap:wrap;gap:8px}.btns .btn{flex:1 1 140px}
.fld{display:block;margin-bottom:10px}.fld span{display:block;font-size:13px;color:var(--mu);font-weight:600;margin-bottom:5px}
input,select{font:inherit;font-size:16px;width:100%;min-height:46px;padding:8px 12px;border:1px solid var(--in);border-radius:12px;background:#fff;color:var(--tx)}
input:focus,select:focus{outline:2px solid rgba(240,138,36,.35);border-color:var(--o)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.oc{display:block;border:1px solid var(--ln);border-radius:14px;padding:13px 14px;margin-bottom:10px;background:#fff}
.oc:last-child{margin-bottom:0}
.oc-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.oc-h .no{color:var(--mu);font-size:13px;font-weight:600;margin-right:4px}
.ol div{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#4b5563;padding:2px 0}.ol b{white-space:nowrap;color:var(--tx)}
.oc-f{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;padding-top:8px;border-top:1px dashed var(--ln);font-size:12px;color:var(--mu)}
.oc-f b{font-size:17px;color:var(--tx)}
.oc.sel{cursor:pointer}.oc.sel.on{border-color:var(--o);box-shadow:0 0 0 2px rgba(240,138,36,.18)}
.oc.sel input{width:22px;min-height:22px;height:22px;accent-color:var(--o);margin:0 8px 0 0;vertical-align:middle}
.li{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--ln)}.li:last-child{border-bottom:0}.li>.f{flex:1;min-width:0}
.nmb .t{font-weight:700;font-size:15px}.nmb .s{font-size:13px;color:var(--mu);margin-top:2px}.nmb .id{font-size:11px;color:#9aa1a9}
.tg{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;background:#eef0f3;color:#4b5563;margin-right:3px}.tg.gift{background:#fde8ef;color:#b0405a}
.qty{font-size:20px;font-weight:800;white-space:nowrap}.qty small{font-size:12px;color:var(--mu);font-weight:600}.qty.low{color:#c62828}
.stk{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:8px}
.stk input{text-align:right}
.price{font-weight:800;white-space:nowrap}
.seg{display:flex;background:#e9ebee;border-radius:12px;padding:4px;margin-bottom:12px}
.seg a{flex:1;text-align:center;padding:9px 0;border-radius:9px;font-size:14px;font-weight:700;color:var(--mu);text-decoration:none}
.seg a.on{background:#fff;color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--ln);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:560px;margin:auto;display:flex}
.nav a{flex:1;text-align:center;padding:7px 0 9px;font-size:11px;font-weight:600;color:#8b929a;text-decoration:none}
.nav a i{display:block;font-style:normal;font-size:20px;line-height:26px;filter:grayscale(1);opacity:.7}
.nav a.on{color:var(--od)}.nav a.on i{filter:none;opacity:1}
.ic{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--ln);border-radius:14px;margin-bottom:10px}
.ic.on{border-color:var(--o);background:#fffaf4}
.ic .f{flex:1;min-width:0}.ic .p{font-size:16px;font-weight:800;margin-top:4px}
.stp{display:flex;align-items:center;border:1px solid var(--in);border-radius:12px;overflow:hidden;background:#fff;flex:none}
.stp button{width:40px;height:42px;border:0;background:#fff;font-size:22px;font-weight:600;color:var(--od);cursor:pointer;padding:0}
.stp input{width:42px;min-height:42px;border:0;border-radius:0;text-align:center;padding:0;font-weight:700}
.stp input:focus{outline:none}
.obar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--ln);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
.obar .in{max-width:560px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.obar .t{flex:1}.obar .t small{display:block;font-size:12px;color:var(--mu);font-weight:600}.obar .t b{font-size:21px;letter-spacing:-.4px}
.obar .btn{min-width:150px;min-height:50px;font-size:16px}
.empty{color:#9aa1a9;font-size:14px;text-align:center;padding:18px 0}
.hint{font-size:12px;color:var(--mu);margin-top:10px}
.sumrow{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0}.sumrow b{font-size:18px}
.foot{text-align:center;font-size:11px;color:#a3a9b0;margin:18px 0 6px}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:rgba(31,35,40,.94);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;display:none;width:max-content;max-width:88%;z-index:9;text-align:center}
.hide{display:none!important}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}input[type=number]{-moz-appearance:textfield}
</style></head><body>
<header class="top"><div class="in"><div class="logo" id="brand">🥭 과일 관리</div><div class="sub" id="brandsub"></div></div></header>
<main class="wrap" id="app"></main>
<nav id="bar" class="hide"></nav>
<div id="toast" role="status"></div>
<script id="core">
// ===== 데이터·업무 로직 (화면과 분리) =====
var KEY='fruitHqTest.v2',OLD_KEYS=['fruitHqTest.v1'],SCHEMA='fruit-items/1';
var CALC_ITEMS_URL='https://jxlovewewe-commits.github.io/fruit-calculator/items.json';
var STATUS=['접수','승인','출고완료','취소'];
// 공통 품목 형식(버전 1): {id,name,country,variety,type('실속'|'선물'),kg,count,cost,price}
function defaultItems(){
  var out=[];
  [['peru-kent','페루','켄트',5.5,12,78000,[35500,48500,61500,54000,76500]],
   ['brazil-keitt','브라질','케이트',4,8,46000,[32500,44000,55500,49500,69900]]].forEach(function(o){
    [['sil4','실속',4],['sil6','실속',6],['sil8','실속',8],['gift6','선물',6],['gift9','선물',9]].forEach(function(t,i){
      out.push({id:o[0]+'-'+t[0],name:'애플망고',country:o[1],variety:o[2],type:t[1],
        kg:Math.round(o[3]*t[2]/o[4]*100)/100,count:t[2],cost:Math.round(o[5]/o[4]*t[2]),price:o[6][i]});
    });});
  return out;
}
function sample(){
  var items=defaultItems(),stock={};items.forEach(function(it){stock[it.id]=20;});
  var st={v:2,sample:true,items:items,stock:stock,
    dealers:[{id:'d1',name:'강남점'},{id:'d2',name:'분당점'},{id:'d3',name:'수원점'}],
    orders:[],shipments:[],seq:{order:0,ship:0,dealer:3}};
  var q={};q['peru-kent-sil6']=3;q['brazil-keitt-gift6']=2;
  var a=placeOrder(st,'d1',q,'2026-11-14');approveOrder(st,a.id);createShipment(st,[a.id],'2026-11-15');
  q={};q['peru-kent-gift6']=2;q['brazil-keitt-sil6']=4;
  var b=placeOrder(st,'d2',q,'2026-11-15');approveOrder(st,b.id);
  q={};q['brazil-keitt-sil4']=5;q['peru-kent-gift9']=1;
  placeOrder(st,'d3',q,'2026-11-16');
  return st;
}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function item(st,id){for(var i=0;i<st.items.length;i++)if(st.items[i].id===id)return st.items[i];return null;}
function dealer(st,id){for(var i=0;i<st.dealers.length;i++)if(st.dealers[i].id===id)return st.dealers[i];return null;}
function order(st,id){for(var i=0;i<st.orders.length;i++)if(st.orders[i].id===id)return st.orders[i];return null;}
function fmtKg(k){return (Math.round(+k*100)/100)+'kg';}
function itemLabel(it){return it.country+' '+it.variety+' '+it.name+' · '+it.type+' '+it.count+'과 ('+fmtKg(it.kg)+')';}
function stockOf(st,id){return +st.stock[id]||0;}
function normItem(x){
  if(!x||typeof x!=='object')throw new Error('품목 형식이 올바르지 않습니다.');
  var it={id:String(x.id==null?'':x.id).trim(),name:String(x.name||'').trim(),country:String(x.country||'').trim(),variety:String(x.variety||'').trim(),type:String(x.type||'').trim(),kg:+x.kg,count:+x.count,cost:+x.cost,price:+x.price};
  if(!it.id)throw new Error('품목 id가 비어 있습니다.');
  if(!it.name||!it.country||!it.variety)throw new Error('상품명·나라·품종을 모두 입력해 주세요. ('+it.id+')');
  if(it.type!=='실속'&&it.type!=='선물')throw new Error('구분은 실속 또는 선물이어야 합니다. ('+it.id+')');
  ['kg','count','cost','price'].forEach(function(k){if(!isFinite(it[k])||it[k]<0)throw new Error(k+' 값은 0 이상 숫자여야 합니다. ('+it.id+')');});
  it.count=Math.round(it.count);it.cost=Math.round(it.cost);it.price=Math.round(it.price);it.kg=Math.round(it.kg*100)/100;
  if(it.count<1)throw new Error('과수는 1 이상이어야 합니다. ('+it.id+')');
  return it;
}
function upsertItem(st,x,isNew){var it=normItem(x),cur=item(st,it.id);
  if(isNew&&cur)throw new Error('이미 있는 품목 id입니다: '+it.id);
  if(cur){for(var k in it)cur[k]=it[k];}else{st.items.push(it);if(!(it.id in st.stock))st.stock[it.id]=0;}return it;}
function itemOrderCount(st,id){return st.orders.filter(function(o){return o.lines.some(function(l){return l.itemId===id;});}).length;}
function removeItem(st,id){st.items=st.items.filter(function(i){return i.id!==id;});delete st.stock[id];}
function itemsFile(st){return {schema:SCHEMA,updated:new Date().toISOString(),items:st.items.map(function(i){return {id:i.id,name:i.name,country:i.country,variety:i.variety,type:i.type,kg:i.kg,count:i.count,cost:i.cost,price:i.price};})};}
function mergeItems(st,file){
  if(!file||file.schema!==SCHEMA||!Array.isArray(file.items))throw new Error('품목 파일 형식(fruit-items/1)이 아닙니다.');
  var norm=file.items.map(normItem),add=0,upd=0;
  norm.forEach(function(it){if(item(st,it.id))upd++;else add++;upsertItem(st,it,false);});
  return {added:add,updated:upd};
}
function orderTotal(o){return o.lines.reduce(function(s,l){return s+l.qty*l.price;},0);}
function placeOrder(st,dealerId,qtys,date){
  var d=dealer(st,dealerId);if(!d)throw new Error('대리점을 선택해 주세요.');
  var lines=[];
  st.items.forEach(function(it){var q=Math.floor(+qtys[it.id]||0);if(q>0)lines.push({itemId:it.id,label:itemLabel(it),qty:q,price:it.price,cost:it.cost});});
  if(!lines.length)throw new Error('수량을 1개 이상 입력해 주세요.');
  st.seq.order++;
  var o={id:'o'+st.seq.order,no:st.seq.order,date:date||today(),dealerId:d.id,dealerName:d.name,lines:lines,status:'접수',settled:false,shipNo:null};
  st.orders.push(o);return o;
}
function approveOrder(st,id){var o=order(st,id);if(!o||o.status!=='접수')throw new Error('접수 상태 주문만 승인할 수 있습니다.');o.status='승인';}
function cancelOrder(st,id,byDealer){var o=order(st,id);if(!o)throw new Error('주문이 없습니다.');
  if(byDealer?o.status!=='접수':(o.status!=='접수'&&o.status!=='승인'))throw new Error(byDealer?'접수 상태일 때만 취소할 수 있습니다.':'출고 전 주문만 취소할 수 있습니다.');o.status='취소';}
function createShipment(st,orderIds,date){
  if(!orderIds.length)throw new Error('출고할 승인 주문을 선택해 주세요.');
  var need={};
  orderIds.forEach(function(id){var o=order(st,id);if(!o||o.status!=='승인')throw new Error('승인된 주문만 출고할 수 있습니다.');
    o.lines.forEach(function(l){need[l.itemId]=(need[l.itemId]||0)+l.qty;});});
  var short=[];
  Object.keys(need).forEach(function(k){var it=item(st,k);var have=stockOf(st,k);if(have<need[k])short.push((it?itemLabel(it):k+' (삭제된 품목)')+' (필요 '+need[k]+'개, 재고 '+have+'개)');});
  if(short.length)throw new Error('재고가 부족해 출고할 수 없습니다: '+short.join(', '));
  Object.keys(need).forEach(function(k){st.stock[k]=stockOf(st,k)-need[k];});
  var made=[];
  orderIds.forEach(function(id){var o=order(st,id);st.seq.ship++;
    var s={id:'s'+st.seq.ship,no:st.seq.ship,date:date||today(),orderId:o.id,orderNo:o.no,dealerId:o.dealerId,dealerName:o.dealerName,lines:o.lines.map(function(l){return {label:l.label,qty:l.qty};})};
    st.shipments.push(s);o.status='출고완료';o.shipNo=s.no;o.shipDate=s.date;made.push(s);});
  return made;
}
function receiveStock(st,id,q){q=Math.floor(+q);if(!(q>0))throw new Error('입고 수량을 1 이상 입력해 주세요.');if(!item(st,id))throw new Error('품목이 없습니다.');st.stock[id]=stockOf(st,id)+q;}
function setStock(st,id,q){q=Math.floor(+q);if(!(q>=0)||String(q)==='NaN')throw new Error('조정 수량은 0 이상이어야 합니다.');if(!item(st,id))throw new Error('품목이 없습니다.');st.stock[id]=q;}
function settlement(st,f){f=f||{};
  var rows=st.orders.filter(function(o){return o.status==='출고완료'&&(!f.dealerId||o.dealerId===f.dealerId)&&(!f.from||o.shipDate>=f.from)&&(!f.to||o.shipDate<=f.to)&&(!f.state||(f.state==='정산완료')===o.settled);});
  var by={};rows.forEach(function(o){var b=by[o.dealerName]||(by[o.dealerName]={total:0,unpaid:0,count:0});var t=orderTotal(o);b.total+=t;b.count++;if(!o.settled)b.unpaid+=t;});
  return {rows:rows,byDealer:by,total:rows.reduce(function(s,o){return s+orderTotal(o);},0),unpaid:rows.reduce(function(s,o){return s+(o.settled?0:orderTotal(o));},0)};
}
function toggleSettled(st,id){var o=order(st,id);if(!o||o.status!=='출고완료')throw new Error('출고완료 주문만 정산할 수 있습니다.');o.settled=!o.settled;}
function addDealer(st,name){name=String(name||'').trim();if(!name)throw new Error('대리점 이름을 입력해 주세요.');
  if(st.dealers.some(function(d){return d.name===name;}))throw new Error('이미 있는 대리점입니다.');st.seq.dealer++;var d={id:'d'+st.seq.dealer+'_'+Date.now().toString(36),name:name};st.dealers.push(d);return d;}
function removeDealer(st,id){st.dealers=st.dealers.filter(function(d){return d.id!==id;});}
function validState(x){return x&&x.v===2&&x.stock&&typeof x.stock==='object'&&Array.isArray(x.items)&&Array.isArray(x.dealers)&&Array.isArray(x.orders)&&Array.isArray(x.shipments)&&x.seq;}
function migrateV1(x){
  // v1: items {id:'pe1'..,origin,name,price,stock} → v2 공통 품목 형식 + stock 맵. 주문은 품목명·단가가 저장돼 있어 그대로 둠.
  var map={};['pe','br'].forEach(function(p,j){for(var i=1;i<=5;i++)map[p+i]=['peru-kent','brazil-keitt'][j]+'-'+['sil4','sil6','sil8','gift6','gift9'][i-1];});
  var st={v:2,sample:!!x.sample,items:defaultItems(),stock:{},dealers:x.dealers,orders:x.orders,shipments:x.shipments,seq:x.seq};
  st.items.forEach(function(it){st.stock[it.id]=0;});
  (x.items||[]).forEach(function(o){var id=map[o.id];var it=id&&item(st,id);if(it){if(isFinite(+o.price))it.price=+o.price;st.stock[id]=+o.stock||0;}});
  st.orders.forEach(function(o){o.lines.forEach(function(l){if(map[l.itemId])l.itemId=map[l.itemId];});});
  return st;
}
function load(storage){
  try{var x=JSON.parse(storage.getItem(KEY));if(validState(x))return x;}catch(e){}
  for(var i=0;i<OLD_KEYS.length;i++){try{var o=JSON.parse(storage.getItem(OLD_KEYS[i]));

  h+='<label class="fld"><span>대리점 선택</span><select id="me">'+dealerOpts(me)+'</select></label>';
  if(!d){$('app').innerHTML=h+'<div class="card empty">등록된 대리점이 없습니다. 본부에 문의해 주세요.</div>'+foot();$('bar').className='hide';$('bar').innerHTML='';return;}
  var mine=S.orders.filter(function(o){return o.dealerId===me;}),r=settlement(S,{dealerId:me}),mon=today().slice(0,7);
  var monAmt=r.rows.filter(function(o){return String(o.shipDate).slice(0,7)===mon;}).reduce(function(s,o){return s+orderTotal(o);},0);
  h+='<div class="kpis k3">'+kpi('진행 중 주문',mine.filter(function(o){return o.status==='접수'||o.status==='승인';}).length+'<small>건</small>','hl')+kpi('이번 달 출고',wonKpi(monAmt))+kpi('미정산',wonKpi(r.unpaid),r.unpaid?'warn':'')+'</div>';
  h+='<div class="seg"><a href="#order" class="'+(p==='order'?'on':'')+'">주문하기</a><a href="#mine" class="'+(p==='mine'?'on':'')+'">내 주문</a><a href="#settle" class="'+(p==='settle'?'on':'')+'">정산 내역</a></div>';
  if(p==='order'){
    h+=S.items.length?S.items.map(function(it){var q=CART[it.id]||0;return '<div class="ic'+(q?' on':'')+'" data-ic="'+esc(it.id)+'"><div class="f">'+nameBlock(it)+'<div class="p">'+won(it.price)+'</div></div><div class="stp"><button type="button" data-step="-1" data-id="'+esc(it.id)+'" aria-label="빼기">−</button><input class="oq" type="number" inputmode="numeric" min="0" data-id="'+esc(it.id)+'" value="'+q+'"><button type="button" data-step="1" data-id="'+esc(it.id)+'" aria-label="더하기">+</button></div></div>';}).join(''):'<div class="card empty">주문 가능한 품목이 없습니다</div>';
    $('bar').className='obar';$('bar').innerHTML='<div class="in"><div class="t"><small id="ocount">선택 0개</small><b id="ototal">0원</b></div><button class="btn pri" data-a="order" id="orderbtn">주문하기</button></div>';
  }else{
    $('bar').className='hide';$('bar').innerHTML='';
    if(p==='mine')h+='<div class="card"><div class="ct">내 주문 <small>접수 상태일 때만 취소 가능</small></div>'+(mine.length?mine.slice().reverse().map(function(o){return orderCard(o,o.status==='접수'?'<div class="acts"><button class="btn danger sm" data-a="dcancel" data-id="'+esc(o.id)+'">주문 취소</button></div>':'',{noDealer:true});}).join(''):'<div class="empty">아직 주문이 없습니다</div>')+'</div>';
    else h+='<div class="card"><div class="sumrow"><span>출고 합계</span><b>'+won(r.total)+'</b></div><div class="sumrow"><span>미정산</span><b style="color:#c62828">'+won(r.unpaid)+'</b></div></div><div class="card"><div class="ct">출고 내역</div>'+(r.rows.length?r.rows.slice().reverse().map(function(o){return orderCard(o,'',{noDealer:true,settle:true});}).join(''):'<div class="empty">출고된 주문이 없습니다</div>')+'</div>';
  }
  $('app').innerHTML=h+foot();
  calcTotal();
}
function calcTotal(){var t=0,c=0;S.items.forEach(function(it){var q=CART[it.id]||0;t+=q*it.price;c+=q;});
  if($('ototal')){$('ototal').textContent=won(t);$('ocount').textContent='선택 '+c+'개';$('orderbtn').disabled=!c;}}
function setQty(id,q){q=Math.max(0,Math.min(9999,Math.floor(+q||0)));if(q)CART[id]=q;else delete CART[id];
  var box=document.querySelector('[data-ic="'+id+'"]');if(box){box.classList.toggle('on',!!q);var inp=box.querySelector('.oq');if(inp&&String(inp.value)!==String(q))inp.value=q;}calcTotal();}
function render(){if(view==='hq')renderHQ();else renderDealer();}

document.addEventListener('click',function(e){
  var stp=e.target.closest('[data-step]');if(stp&&view==='dealer'){setQty(stp.dataset.id,(CART[stp.dataset.id]||0)+(+stp.dataset.step));return;}
  var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a,id=b.dataset.id;
  if(view!=='hq'&&HQ_ACTIONS.indexOf(a)>=0)return;
  if(view==='hq'&&(a==='order'||a==='dcancel'))return;
  if(a==='in')act(function(){receiveStock(S,id,$('q-'+id).value);},'입고했습니다');
  else if(a==='adj')act(function(){var v=$('q-'+id).value;if(v==='')throw new Error('조정할 재고 수량을 입력해 주세요.');setStock(S,id,v);},'재고를 조정했습니다');
  else if(a==='approve')act(function(){approveOrder(S,id);},'주문을 승인했습니다');
  else if(a==='cancel'){if(confirm('이 주문을 취소할까요?'))act(function(){cancelOrder(S,id,false);},'주문을 취소했습니다');}
  else if(a==='selall'){var cs=document.querySelectorAll('.shp'),all=[].every.call(cs,function(c){return c.checked;});cs.forEach(function(c){c.checked=!all;c.closest('.oc').classList.toggle('on',!all);});}
  else if(a==='ship'){var ids=[].map.call(document.querySelectorAll('.shp:checked'),function(c){return c.value;});act(function(){var m=createShipment(S,ids);return '출고 지시 '+m.length+'건을 만들었습니다. 재고가 차감됐어요';});}
  else if(a==='settle')act(function(){toggleSettled(S,id);},'정산 상태를 바꿨습니다');
  else if(a==='edititem'){EDIT=id;if(location.hash!=='#items')location.hash='items';else render();setTimeout(function(){var f=$('itemform');if(f)f.scrollIntoView({block:'start'});},0);}
  else if(a==='canceledit'){EDIT='';render();}
  else if(a==='saveitem')act(function(){var num=function(k){var v=$('it-'+k).value;return v===''?NaN:v;};var x={id:EDIT||(($('it-id')&&$('it-id').value.trim())||('item-'+Date.now().toString(36))),name:$('it-name').value,country:$('it-country').value,variety:$('it-variety').value,type:$('it-type').value,kg:num('kg'),count:num('count'),cost:num('cost'),price:num('price')};
    var was=!!EDIT;upsertItem(S,x,!was);EDIT='';return was?'품목을 수정했습니다':'품목을 추가했습니다 (재고 0개)';});
  else if(a==='delitem'){var di=item(S,id),n=itemOrderCount(S,id);if(di&&confirm(n?('이 품목이 들어간 주문이 '+n+'건 있습니다. 삭제할까요?\n기존 주문에는 주문 당시 품목명과 단가가 저장돼 있어 그대로 남고, 이 품목의 재고 기록은 지워집니다.'):(itemLabel(di)+' 품목을 삭제할까요?')))act(function(){removeItem(S,id);if(EDIT===id)EDIT='';},'품목을 삭제했습니다');}
  else if(a==='calcitems'){fetch(CALC_ITEMS_URL+'?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('nf');return r.json();}).then(function(f){act(function(){var m=mergeItems(S,f);return '계산기 품목을 불러왔습니다 (추가 '+m.added+'개, 갱신 '+m.updated+'개)';});},function(){toast('계산기 품목 파일을 찾지 못했습니다');});}
  else if(a==='itemsexport')download(itemsFile(S),'items.json','품목 JSON(fruit-items/1)으로 내보냈습니다');
  else if(a==='itemsimport')$('itemsfile').click();
  else if(a==='adddealer')act(function(){addDealer(S,$('newdealer').value);},'대리점을 추가했습니다');
  else if(a==='deldealer'){var dd=dealer(S,id);if(dd&&confirm(dd.name+'을(를) 삭제할까요? 기존 주문 기록은 남습니다.'))act(function(){removeDealer(S,id);},'대리점을 삭제했습니다');}
  else if(a==='copylink')copyLink(dealerLink(id));
  else if(a==='export')download(S,'fruit-hq-test-'+today()+'.json','전체 데이터를 JSON 파일로 내보냈습니다');
  else if(a==='import')$('file').click();
  else if(a==='reset'){if(confirm('모든 데이터를 지우고 예시 데이터로 되돌릴까요?')){S=sample();save(localStorage,S);render();toast('예시 데이터로 되돌렸습니다');}}
  else if(a==='order')act(function(){var o=placeOrder(S,me,CART);CART={};return '주문 #'+o.no+'이 접수됐습니다';});
  else if(a==='dcancel'){if(confirm('이 주문을 취소할까요?'))act(function(){cancelOrder(S,id,true);},'주문을 취소했습니다');}
});
function download(obj,name,msg){var bl=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});var l=document.createElement('a');l.href=URL.createObjectURL(bl);l.download=name;document.body.appendChild(l);l.click();l.remove();toast(msg);}
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='me'&&view==='dealer'){me=t.value;CART={};localStorage.setItem(KEY+'.me',me);var u=new URL(location.href);u.searchParams.set('d',me);u.searchParams.delete('dealer');history.replaceState(null,'',u);render();}
  else if(t.classList.contains('shp')){t.closest('.oc').classList.toggle('on',t.checked);}
  else if(t.classList.contains('oq')){setQty(t.dataset.id,t.value);}
  else if(view!=='hq')return;
  else if(t.id&&t.id.indexOf('f-')===0){F[t.id.slice(2)]=t.value;render();}
  else if(t.id==='itemsfile'&&t.files[0]){var r2=new FileReader();r2.onload=function(){var x;try{x=JSON.parse(r2.result);}catch(er){toast('⚠️ JSON 파일을 읽지 못했습니다');return;}act(function(){var m=mergeItems(S,x);return '품목을 가져왔습니다 (추가 '+m.added+'개, 갱신 '+m.updated+'개)';});};r2.readAsText(t.files[0]);t.value='';}
  else if(t.id==='file'&&t.files[0]){var rd=new FileReader();rd.onload=function(){try{var x=JSON.parse(rd.result);if(!validState(x)&&x&&x.v===1)x=migrateV1(x);if(!validState(x))throw 0;S=x;save(localStorage,S);render();toast('데이터를 가져왔습니다');}catch(er){toast('⚠️ 올바른 데이터 파일이 아닙니다');}};rd.readAsText(t.files[0]);t.value='';}
});
document.addEventListener('input',function(e){if(e.target.classList.contains('oq')&&e.target.value!=='')setQty(e.target.dataset.id,e.target.value);});
window.addEventListener('hashchange',function(){if(page()!=='items')EDIT='';render();window.scrollTo(0,0);});
window.addEventListener('storage',function(e){if(e.key===KEY){S=load(localStorage);render();}});
if(view==='dealer')document.title='대리점 주문';
render();
</script>
</body></html>
